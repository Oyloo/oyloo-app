name: Oyloo
options:
  bundleIdPrefix: com.oyloo.life
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing team. This one is a free provisioning team: profiles last 7
    # days and App Groups are not issued at all, so shared settings and the
    # token live in a shared keychain item (see SharedDefaults) and the share
    # extension uploads the capture itself. With a paid membership, put the
    # paid team here and restore com.apple.security.application-groups in
    # both *.entitlements files.
    DEVELOPMENT_TEAM: "8QM66BKC25"
    CODE_SIGN_STYLE: Automatic

packages:
  OpenTelemetry:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: 2.5.2

targets:
  Oyloo:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oyloo.life.app
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: Oyloo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension
      - package: OpenTelemetry
        product: OpenTelemetryApi
      - package: OpenTelemetry
        product: OpenTelemetrySdk
      - package: OpenTelemetry
        product: OpenTelemetryProtocolExporterHTTP

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Extension
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oyloo.life.app.share
        INFOPLIST_FILE: Sources/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extension/Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: ShareToOyloo
    dependencies:
      - package: OpenTelemetry
        product: OpenTelemetryApi
      - package: OpenTelemetry
        product: OpenTelemetrySdk
      - package: OpenTelemetry
        product: OpenTelemetryProtocolExporterHTTP
